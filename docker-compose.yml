# 送货单生成器 —— fnOS / NAS 部署（单文件两种模式）
#
#   镜像模式（默认，推荐）：docker compose up -d
#       拉 ghcr.io 现成镜像 + Watchtower 每 5 分钟自动更新
#
#   源码同步模式：把 .env 里 COMPOSE_PROFILES 改成 source 后 docker compose up -d
#       或临时：docker compose --profile source up -d
#       （容器内 git 每 5 分钟对齐远端，先 GitHub 后 Gitee）
#
# 两种模式都占 8088，不要同时启动；切换前先 docker compose down。
# 单据数据存在浏览器 localStorage，按访问地址隔离，
# 从 file:// 迁到 http:// 需要用软件里的「导出备份 / 导入备份」搬一次。

services:
  # ==================== 镜像模式 ====================
  web:
    profiles: ["image"]
    image: ghcr.io/y-nanli/delivery-note-generator:latest
    container_name: delivery-note-web
    restart: unless-stopped
    ports:
      - "8088:80"
    labels:
      # 只让 Watchtower 跟踪这一个容器
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    profiles: ["image"]
    image: containrrr/watchtower:latest
    container_name: delivery-note-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - TZ=Asia/Shanghai

  # ==================== 源码同步模式 ====================
  sync:
    profiles: ["source"]
    image: alpine/git:latest
    container_name: delivery-note-sync
    restart: unless-stopped
    volumes:
      - ./htdocs:/repo
    entrypoint:
      - /bin/sh
      - -c
      - |
        PRIMARY="https://gh-proxy.com/https://github.com/Y-NanLi/delivery-note-generator.git"
        BACKUP="https://gitee.com/nan-liGit/delivery-note-generator.git"
        sync() {
          for U in "$PRIMARY" "$BACKUP"; do
            if [ -d /repo/.git ]; then
              git -C /repo remote set-url origin "$U"
              if git -C /repo fetch --depth 1 origin master && git -C /repo reset --hard origin/master; then
                echo "synced from $U $(date)"; return 0
              fi
            else
              if git clone --depth 1 "$U" /repo; then
                echo "cloned from $U $(date)"; return 0
              fi
            fi
          done
          echo "all sources failed $(date)"; return 1
        }
        sync || true
        while true; do sleep 300; sync || true; done

  web-src:
    profiles: ["source"]
    image: nginx:alpine
    container_name: delivery-note-web-src
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./htdocs:/usr/share/nginx/html:ro
    depends_on:
      - sync
